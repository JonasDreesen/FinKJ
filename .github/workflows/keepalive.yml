name: Supabase keep-alive

# Gratis Supabase-projecten pauzeren na 7 dagen zonder activiteit.
# Deze workflow spreekt de database om de 3 dagen even aan.
on:
  schedule:
    - cron: '23 5 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o response.txt -w '%{http_code}' --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase antwoordt niet (HTTP $status). Is het project gepauzeerd, of is docs/sql/schema.sql nog niet uitgevoerd?"
            exit 1
          fi
